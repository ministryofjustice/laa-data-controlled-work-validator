plugins {
    id 'com.diffplug.spotless' apply false
}

subprojects {
    group = 'uk.gov.justice.laa.springboot.microservice'

    repositories {
        mavenCentral()
        // GitHub Packages for published API models
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/ministryofjustice/laa-data-claims-api")
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }

    // Apply to subprojects that have java plugin
    plugins.withType(JavaPlugin) {
        test {
            useJUnitPlatform()
        }

        // Suppress Javadoc warnings for Lombok-generated code
        tasks.withType(Javadoc) {
            options.addStringOption('Xdoclint:none', '-quiet')
        }

        // Suppress deprecation warnings - these come from OpenAPI generated code
        // which uses deprecated Spring APIs. The generator will update these when needed.
        tasks.withType(JavaCompile) {
            options.compilerArgs << '-Xlint:-deprecation'
        }
    }

    // Apply testlogger only if available (comes from laa-spring-boot-gradle-plugin)
    pluginManager.withPlugin('com.adarshr.test-logger') {
        testlogger {
            theme 'mocha'
        }
    }
}

// Configure spotless and checkstyleStaged for core and service modules
configure(subprojects.findAll { it.name in ['claims-validation-core', 'claims-validation-service'] }) {
    apply plugin: 'com.diffplug.spotless'

    spotless {
        java {
            target 'src/*/java/**/*.java'
            targetExclude 'src/main/java/uk/gov/justice/laa/dstew/payments/claims/validation/core/error/ClaimValidationError.java'
            importOrder()
            removeUnusedImports()
            cleanthat()
            googleJavaFormat()
        }
    }

    tasks.register("checkstyleStaged", Checkstyle) {
        group = "verification"
        description = "Runs Checkstyle on staged files only"

        def filesToCheck = project.findProperty("checkstyleFiles")
        if (filesToCheck != null) {
            source = files(filesToCheck.split(","))
        } else {
            source = sourceSets.main.allJava
        }

        classpath = sourceSets.main.compileClasspath
    }
}

// Configure publishing for library modules only
configure(subprojects.findAll { it.name in ['claims-validation-api', 'claims-validation-core'] }) {
    apply plugin: 'maven-publish'

    publishing {
        repositories {
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/ministryofjustice/laa-data-claims-validation-api-poc")
                credentials {
                    username = System.getenv("GITHUB_ACTOR")
                    password = System.getenv("GITHUB_TOKEN")
                }
            }
        }
    }
}

// Root-level task to run checkstyleStaged on all subprojects
tasks.register("checkstyleStaged") {
    group = "verification"
    description = "Runs Checkstyle on staged files across all subprojects"
    dependsOn subprojects.findAll { it.tasks.findByName('checkstyleStaged') }.collect { it.tasks.checkstyleStaged }
}

plugins {
    id 'org.openapi.generator'
    id 'uk.gov.justice.service.laa.laa-spring-boot-gradle-plugin'
}

repositories {
    mavenCentral()
}

dependencies {

    /**
     * Upgrades to resolve vulnerabilities
     */
    // Upgrade to fix Uncontrolled Recursion vulnerability in commons-lang3
    //implementation 'org.apache.commons:commons-lang3:3.18.0'
    // Upgrade to fix vulnerabilities in tomcat-embed-core
    //implementation 'org.apache.tomcat.embed:tomcat-embed-core:11.0.9'
    // Upgrade to fix CVE-2026-1225 vulnerability in logback-core
    implementation 'ch.qos.logback:logback-core:1.6.4'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.12'
}

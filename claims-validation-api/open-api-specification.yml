openapi: "3.0.0"
info:
  version: 1.0.0
  title: Claims Validation API
  description: Stateless validation service for LAA Data Claims
paths:
  /v1/validation/claim:
    post:
      tags:
        - validation
      summary: Validate a claim
      operationId: validateClaim
      requestBody:
        description: Claim validation request
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimValidationRequest'
      responses:
        '200':
          description: 'Validation completed'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"
        '400':
          description: 'Bad request'
        '401':
          description: 'Unauthorized'
        '403':
          description: 'Forbidden'
        '500':
          description: 'Internal server error'

components:
  schemas:
    ClaimValidationRequest:
      type: object
      properties:
        claim:
          $ref: '#/components/schemas/Claim'
        scope:
          type: string
          description: Optional validation scope (e.g., "fee", "disbursement", "all")
          example: "fee"
        related_claims:
          type: array
          description: Other claims in the same submission (for duplicate checking)
          items:
            $ref: '#/components/schemas/Claim'

    Claim:
      type: object
      description: Claim data for validation
      properties:
        area_of_law:
          $ref: '#/components/schemas/AreaOfLaw'
        office_account_number:
          type: string
          description: The unique account number assigned to the provider office by the LAA
          example: "1A234B"
        id:
          type: string
          format: uuid
          description: Unique identifier for the claim
        submission_id:
          type: string
          format: uuid
          description: UUID of the parent submission
        status:
          $ref: '#/components/schemas/ClaimStatus'
        line_number:
          type: integer
          description: Line number within the submission
        schedule_reference:
          type: string
          description: Reference to the schedule
        submission_period:
          type: string
          description: Submission period (e.g., "JUL-2025")
        case_reference_number:
          type: string
          description: Case reference number
        unique_file_number:
          type: string
          description: Provider's unique case reference number for controlled work billing (format DDMMYY/NNN)
        case_start_date:
          type: string
          description: Date the case was started (format YYYY-MM-DD)
        case_concluded_date:
          type: string
          description: Date the case was concluded (format YYYY-MM-DD)
        case_id:
          type: string
          description: Case identifier
        unique_case_id:
          type: string
          description: Unique case identifier
        case_stage_code:
          type: string
          description: Code indicating the stage of the case
        matter_type_code:
          type: string
          description: Matter type code
        crime_matter_type_code:
          type: string
          description: Crime-specific matter type code
        fee_scheme_code:
          type: string
          description: Fee scheme code
        fee_code:
          type: string
          description: Alphanumeric code identifying the specific fee type or category
        procurement_area_code:
          type: string
          description: Procurement area code
        access_point_code:
          type: string
          description: Access point code
        delivery_location:
          type: string
          description: Location where service was delivered
        representation_order_date:
          type: string
          description: Date the representation order was created (format YYYY-MM-DD)
        suspects_defendants_count:
          type: integer
          description: Number of suspects/defendants
        police_station_court_attendances_count:
          type: integer
          description: Number of police station or court attendances
        police_station_court_prison_id:
          type: string
          description: Police station, court, or prison identifier
        dscc_number:
          type: string
          description: DSCC number
        maat_id:
          type: string
          description: MAAT identifier
        prison_law_prior_approval_number:
          type: string
          description: Prison law prior approval number
        is_duty_solicitor:
          type: boolean
          description: Whether this is a duty solicitor case
        is_youth_court:
          type: boolean
          description: Whether this is a youth court case
        scheme_id:
          type: string
          description: Scheme identifier
        mediation_sessions_count:
          type: integer
          description: Number of mediation sessions
        mediation_time_minutes:
          type: integer
          description: Total mediation time in minutes
        outreach_location:
          type: string
          description: Outreach location
        referral_source:
          type: string
          description: Source of referral
        client_forename:
          type: string
          description: Client's first name
        client_surname:
          type: string
          description: Client's surname
        client_date_of_birth:
          type: string
          description: Client's date of birth (format YYYY-MM-DD)
        unique_client_number:
          type: string
          description: Unique client number
        client_postcode:
          type: string
          description: Client's postcode
        gender_code:
          type: string
          description: Gender code
        ethnicity_code:
          type: string
          description: Ethnicity code
        disability_code:
          type: string
          description: Disability code
        is_legally_aided:
          type: boolean
          description: Whether client is legally aided
        client_type_code:
          type: string
          description: Client type code
        home_office_client_number:
          type: string
          description: Home Office client number (for immigration cases)
        cla_reference_number:
          type: string
          description: CLA reference number
        cla_exemption_code:
          type: string
          description: CLA exemption code
        client2_forename:
          type: string
          description: Second client's first name
        client2_surname:
          type: string
          description: Second client's surname
        client2_date_of_birth:
          type: string
          description: Second client's date of birth (format YYYY-MM-DD)
        client2_ucn:
          type: string
          description: Second client's unique client number
        client2_postcode:
          type: string
          description: Second client's postcode
        client2_gender_code:
          type: string
          description: Second client's gender code
        client2_ethnicity_code:
          type: string
          description: Second client's ethnicity code
        client2_disability_code:
          type: string
          description: Second client's disability code
        client2_is_legally_aided:
          type: boolean
          description: Whether second client is legally aided
        stage_reached_code:
          type: string
          description: Stage reached code
        standard_fee_category_code:
          type: string
          description: Standard fee category code
        outcome_code:
          type: string
          description: Outcome code
        designated_accredited_representative_code:
          type: string
          description: Designated accredited representative code
        is_postal_application_accepted:
          type: boolean
          description: Whether postal application was accepted
        is_client2_postal_application_accepted:
          type: boolean
          description: Whether second client's postal application was accepted
        mental_health_tribunal_reference:
          type: string
          description: Mental health tribunal reference
        is_nrm_advice:
          type: boolean
          description: Whether NRM advice was provided
        follow_on_work:
          type: string
          description: Follow-on work details
        transfer_date:
          type: string
          description: Transfer date (format YYYY-MM-DD)
        exemption_criteria_satisfied:
          type: string
          description: Exemption criteria satisfied
        exceptional_case_funding_reference:
          type: string
          description: Exceptional case funding reference
        is_legacy_case:
          type: boolean
          description: Whether this is a legacy case
        advice_time:
          type: integer
          description: Advice time in minutes
        travel_time:
          type: integer
          description: Travel time in minutes
        waiting_time:
          type: integer
          description: Waiting time in minutes
        net_profit_costs_amount:
          type: number
          description: Net profit costs amount
        net_disbursement_amount:
          type: number
          description: Net disbursement amount
        net_counsel_costs_amount:
          type: number
          description: Net counsel costs amount
        disbursements_vat_amount:
          type: number
          description: Disbursements VAT amount
        travel_waiting_costs_amount:
          type: number
          description: Travel and waiting costs amount
        net_waiting_costs_amount:
          type: number
          description: Net waiting costs amount
        is_vat_applicable:
          type: boolean
          description: Whether VAT is applicable
        is_tolerance_applicable:
          type: boolean
          description: Whether tolerance is applicable
        prior_authority_reference:
          type: string
          description: Prior authority reference
        is_london_rate:
          type: boolean
          description: Whether London rate applies
        adjourned_hearing_fee_amount:
          type: integer
          description: Number of times the hearing was adjourned
        is_additional_travel_payment:
          type: boolean
          description: Whether additional travel payment applies
        costs_damages_recovered_amount:
          type: number
          description: Costs/damages recovered amount
        meetings_attended_code:
          type: string
          description: Meetings attended code
        detention_travel_waiting_costs_amount:
          type: number
          description: Detention travel and waiting costs amount
        jr_form_filling_amount:
          type: number
          description: JR form filling amount
        is_eligible_client:
          type: boolean
          description: Whether client is eligible
        court_location_code:
          type: string
          description: Court location code
        advice_type_code:
          type: string
          description: Advice type code
        medical_reports_count:
          type: integer
          description: Number of medical reports
        is_irc_surgery:
          type: boolean
          description: Whether IRC surgery applies
        surgery_date:
          type: string
          description: Surgery date (format YYYY-MM-DD)
        surgery_clients_count:
          type: integer
          description: Number of surgery clients
        surgery_matters_count:
          type: integer
          description: Number of surgery matters
        cmrh_oral_count:
          type: integer
          description: CMRH oral count
        cmrh_telephone_count:
          type: integer
          description: CMRH telephone count
        ait_hearing_centre_code:
          type: string
          description: AIT hearing centre code
        is_substantive_hearing:
          type: boolean
          description: Whether this is a substantive hearing
        ho_interview:
          type: integer
          description: Number of Home Office interviews
        local_authority_number:
          type: string
          description: Local authority number
        created_by_user_id:
          type: string
          description: ID of the user who created the claim
        is_amended:
          type: boolean
          description: Whether the claim has been amended
        has_assessment:
          type: boolean
          description: Whether the claim has an assessment
        version:
          type: integer
          description: Version number for optimistic locking

    AreaOfLaw:
      type: string
      enum:
        - CRIME LOWER
        - LEGAL HELP
        - MEDIATION
      x-enum-varnames:
        - CRIME_LOWER
        - LEGAL_HELP
        - MEDIATION
      description: Area of law for the claim

    ClaimStatus:
      type: string
      enum:
        - READY_TO_PROCESS
        - VALID
        - INVALID
        - VOID
      description: Processing status of the claim

    ValidationResult:
      type: object
      required:
        - is_valid
        - issues
      properties:
        is_valid:
          type: boolean
          description: Whether the claim passed all validation rules
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'

    ValidationIssue:
      type: object
      required:
        - code
        - message
        - severity
      properties:
        code:
          type: string
          description: Unique code identifying the validation issue
          example: "FEE.MISSING_JUSTIFICATION"
        message:
          type: string
          description: Human-readable description of the issue
          example: "Enhancement fee requires a justification."
        technical_message:
          type: string
          description: Detailed technical description for debugging (may include field paths, expected values, etc.)
          example: "Invalid value 'XYZ' for field 'claim.area_of_law'. Expected one of: [LEGAL HELP, CRIME LOWER, MEDIATION]"
        path:
          type: array
          items:
            oneOf:
              - type: string
              - type: integer
          description: JSON path to the field causing the issue
          example: ["fees", 0, "justification"]
        severity:
          $ref: '#/components/schemas/ValidationSeverity'

    ValidationSeverity:
      type: string
      enum:
        - ERROR
        - WARNING
        - INFO
      description: Severity level of the validation issue

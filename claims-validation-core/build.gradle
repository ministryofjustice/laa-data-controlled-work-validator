plugins {
    id 'java-library'
    id 'maven-publish'
    id 'io.freefair.lombok'
    id 'uk.gov.laa.springboot.laa-spring-boot-gradle-plugin'
}

// Use Maven Central for resolving dependencies.
repositories {
    mavenCentral()
}

java {
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    api project(':claims-validation-api')

    implementation project(':reference-provider-details-api')
    implementation project(':reference-fee-scheme-platform-api')
    
    // Published package from laa-data-claims-api (replaces local reference-data-claims-api)
    implementation 'uk.gov.justice.laa.datastewardship.payments:data-claims-api-models:4803269'

    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.data:spring-data-commons'
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'com.networknt:json-schema-validator:1.5.8'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    finalizedBy jacocoTestReport
}

// disable for library module
tasks.named('bootJar') {
    enabled = false
}

tasks.named('bootRun') {
    enabled = false
}

tasks.named('jar') {
    enabled = true
}





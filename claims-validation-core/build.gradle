plugins {
    id 'java-library'
    id 'maven-publish'
    id 'io.freefair.lombok'
    id 'uk.gov.justice.service.laa.laa-spring-boot-gradle-plugin'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Explicit, documented GitHub Packages repositories for LAA-internal artifacts - FALLBACK ONLY.
//
// laa-java-gradle-plugin (applied transitively via laa-spring-boot-gradle-plugin) already
// configures mavenCentral() + a single maven.pkg.github.com/.../laa-spring-boot-common
// repository. It currently works for every group below, including ones not actually published
// from laa-spring-boot-common, because GitHub Packages Maven URLs route purely on the *owner*
// (ministryofjustice) - the repo-name path segment is not validated or used for authorization.
// That's an observed, undocumented quirk of GitHub's implementation though, not a behaviour
// GitHub documents or guarantees, so we don't want to depend on it being the *only* path to
// resolution.
//
// The repositories below are deliberately NOT exclusive. They are added *after* the plugin's
// repositories are already registered (repositories are tried in registration order), so in
// practice the plugin's existing repo keeps serving every lookup first, exactly as it does
// today - nothing changes about current, working behaviour. These entries only get used if that
// ever stops working for a given group (e.g. GitHub starts enforcing the repo-name segment, the
// plugin's repository config changes, or credentials diverge per-repo in future).
//
// Credentials:
//   - Locally: export GITHUB_ACTOR and GITHUB_TOKEN (a PAT with read:packages, authorized for
//     the ministryofjustice org SSO, and with read access to laa-data-provider-data since that
//     repo is private).
//   - In CI: the reusable gradle-build-and-publish.yml workflow sets GITHUB_PACKAGES_TOKEN
//     (mapped from the gh_packages_token secret) in addition to GITHUB_TOKEN, so we prefer
//     GITHUB_PACKAGES_TOKEN when present and fall back to GITHUB_TOKEN otherwise.
repositories {
    maven {
        name = 'laaDataProviderData'
        url = uri('https://maven.pkg.github.com/ministryofjustice/laa-data-provider-data')
        credentials {
            username = System.getenv('GITHUB_ACTOR')
            password = System.getenv('GITHUB_PACKAGES_TOKEN') ?: System.getenv('GITHUB_TOKEN')
        }
        content {
            includeGroup 'uk.gov.justice.laadata.providers'
        }
    }

    maven {
        name = 'laaDataClaimsApi'
        url = uri('https://maven.pkg.github.com/ministryofjustice/laa-data-claims-api')
        credentials {
            username = System.getenv('GITHUB_ACTOR')
            password = System.getenv('GITHUB_PACKAGES_TOKEN') ?: System.getenv('GITHUB_TOKEN')
        }
        content {
            includeGroup 'uk.gov.justice.laa.datastewardship.payments'
        }
    }
}

java {
    withSourcesJar()
    withJavadocJar()
}

dependencies {

    implementation project(':reference-fee-scheme-platform-api')

    implementation 'uk.gov.justice.laa.datastewardship.payments:data-claims-api-models:1.22.10'
    implementation 'uk.gov.justice.laadata.providers:providers-api:1.55.2'

    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.data:spring-data-commons'
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'com.networknt:json-schema-validator:1.5.8'
    implementation 'io.swagger.core.v3:swagger-annotations:2.2.55'
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.4.0'
    implementation 'io.github.resilience4j:resilience4j-reactor:2.4.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation("io.projectreactor:reactor-test:3.8.7")
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    finalizedBy jacocoTestReport
}

tasks.register("checkstyleStaged", Checkstyle) {
    group = "verification"
    description = "Runs Checkstyle on staged files only"

    def filesToCheck = project.findProperty("checkstyleFiles")
    if (filesToCheck != null) {
        source = files(filesToCheck.split(","))
    } else {
        source = sourceSets.main.allJava
    }

    classpath = sourceSets.main.compileClasspath
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = project.name
        }
    }
}

// disable for library module
tasks.named('bootJar') {
    enabled = false
}

tasks.named('bootRun') {
    enabled = false
}

tasks.named('jar') {
    enabled = true
}

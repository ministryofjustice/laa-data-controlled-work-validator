services:
  app:
    build:
      context: .
    ports:
      - "${APP_PORT:-8081}:8081"
      - "${MANAGEMENT_PORT:-8181}:8181"
    environment:
      - FEE_SCHEME_SERVICE_URL=${FEE_SCHEME_SERVICE_URL:-http://fee-scheme:8082}
      - DATA_CLAIMS_SERVICE_URL=${DATA_CLAIMS_SERVICE_URL:-http://data-claims:8083}
      - EXTERNAL_CONNECT_TIMEOUT=${EXTERNAL_CONNECT_TIMEOUT:-5000}
      - EXTERNAL_READ_TIMEOUT=${EXTERNAL_READ_TIMEOUT:-10000}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-local}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8181/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

pluginManagement {
    repositories {
        mavenCentral()
        maven { url = "https://plugins.gradle.org/m2/" }
        gradlePluginPortal()
    }

    plugins {
        id 'uk.gov.justice.service.laa.laa-spring-boot-gradle-plugin' version '3.0.3'
        id 'io.freefair.lombok' version '9.5.0'
        id 'com.diffplug.spotless' version '8.10.2'
        id 'io.sentry.jvm.gradle' version '6.21.0'
        id 'net.researchgate.release' version '3.1.0'
        id 'org.openapi.generator' version '7.25.0'
    }
}

rootProject.name = 'laa-data-controlled-work-validator'

include 'claims-validation-core', 'reference-fee-scheme-platform-api', 'reference-provider-details-api'

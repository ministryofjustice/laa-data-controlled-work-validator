pluginManagement {
    repositories {
        maven {
            name = "gitHubPackages"
            url = 'https://maven.pkg.github.com/ministryofjustice/laa-spring-boot-common'
            credentials {
                username = System.getenv("GITHUB_ACTOR")?.trim() ?: settings.ext.find('project.ext.gitPackageUser')
                password = System.getenv("GITHUB_TOKEN")?.trim() ?: settings.ext.find('project.ext.gitPackageKey')
            }
        }
        maven { url = "https://plugins.gradle.org/m2/" }
        gradlePluginPortal()
    }

    plugins {
        id 'uk.gov.laa.springboot.laa-spring-boot-gradle-plugin' version '2.1.0'
        id 'io.freefair.lombok' version '9.5.0'
        id 'com.diffplug.spotless' version '8.6.0'
        id 'io.sentry.jvm.gradle' version '6.10.0'
        id 'net.researchgate.release' version '3.1.0'
    }
}

rootProject.name = 'laa-data-controlled-work-validator'

include 'claims-validation-core', 'reference-fee-scheme-platform-api', 'reference-provider-details-api'

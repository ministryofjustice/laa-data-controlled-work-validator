server:
  port: 8081 # change to desired port number

spring:
  application:
    name: LAA Claims Validation Service

management:
  server:
    port: 8181 # change to desired port number
  # specify actuator endpoints to enable
  endpoints:
    web:
      exposure:
        include: health, info, metrics

# External service configuration
external:
  validation:
    base-url: ${VALIDATION_SERVICE_URL:http://localhost:8080}
    connect-timeout-ms: ${EXTERNAL_CONNECT_TIMEOUT:5000}
    read-timeout-ms: ${EXTERNAL_READ_TIMEOUT:10000}
  fee-scheme:
    base-url: ${FEE_SCHEME_SERVICE_URL:http://localhost:8082}
  data-claims:
    base-url: ${DATA_CLAIMS_SERVICE_URL:http://localhost:8083}

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}

# Logging configuration
logging:
  level:
    uk.gov.justice.laa.dstew.payments.claims: ${LOG_LEVEL:INFO}
    org.springframework.web.reactive.function.client: ${WEBCLIENT_LOG_LEVEL:WARN}

syntax = "proto3";

package uk.gov.justice.laa.dstew.payments.claims.validation.grpc;

option java_multiple_files = true;
option java_package = "uk.gov.justice.laa.dstew.payments.claims.validation.grpc.proto";
option java_outer_classname = "ClaimValidationProto";

// Claim Validation Service - validates claims against business rules
service ClaimValidationService {
    // Validates a single claim and returns validation issues
    rpc ValidateClaim (ProtoClaimValidationRequest) returns (ProtoClaimValidationResponse);

    // Validates multiple claims in a stream (bidirectional streaming)
    rpc ValidateClaimStream (stream ProtoClaimValidationRequest) returns (stream ProtoClaimValidationResponse);
}

// Request message for claim validation
message ProtoClaimValidationRequest {
    // The claim to validate
    ProtoClaim claim = 1;

    // Validation scope: "all", "fee", or "disbursement"
    string scope = 2;

    // Related claims for duplicate checking
    repeated ProtoClaim related_claims = 3;
}

// Response message containing validation results
message ProtoClaimValidationResponse {
    // Whether the claim passed all validation rules
    bool is_valid = 1;

    // List of validation issues found
    repeated ProtoValidationIssue issues = 2;
}

// Represents a validation issue found during claim validation
message ProtoValidationIssue {
    // Unique code identifying the validation issue
    string code = 1;

    // Human-readable description of the issue
    string message = 2;

    // Severity level: ERROR, WARNING, INFO
    string severity = 3;

    // Path to the field that caused the issue
    repeated string path = 4;

    // Technical details for debugging
    string technical_message = 5;
}

// Claim data to be validated
message ProtoClaim {
    // Unique identifier for the claim
    string id = 1;

    // Area of law: LEGAL HELP, CRIME LOWER, MEDIATION
    string area_of_law = 2;

    // Office account number (6 alphanumeric characters)
    string office_account_number = 3;

    // Unique file number (format: DDMMYY/NNN)
    string unique_file_number = 4;

    // Case start date (format: YYYY-MM-DD)
    string case_start_date = 5;

    // Case concluded date (format: YYYY-MM-DD)
    string case_concluded_date = 6;

    // Client date of birth (format: YYYY-MM-DD)
    string client_date_of_birth = 7;

    // Client forename
    string client_forename = 8;

    // Client surname
    string client_surname = 9;

    // Unique client number
    string unique_client_number = 10;

    // Matter type code
    string matter_type_code = 11;

    // Stage reached code
    string stage_reached_code = 12;

    // Outcome code
    string outcome_code = 13;

    // Fee code
    string fee_code = 14;

    // Schedule reference
    string schedule_reference = 15;

    // Net profit costs amount
    double net_profit_costs_amount = 16;

    // Disbursements VAT amount
    double disbursements_vat_amount = 17;

    // Net disbursement amount
    double net_disbursement_amount = 18;

    // Submission period (format: MMM-YYYY)
    string submission_period = 19;

    // Claim status: READY_TO_PROCESS, VALID, INVALID, VOID
    string status = 20;

    // Line number in submission
    int32 line_number = 21;

    // Travel waiting costs amount
    double travel_waiting_costs_amount = 22;

    // Client postcode
    string client_postcode = 23;

    // Gender code
    string gender_code = 24;

    // Ethnicity code
    string ethnicity_code = 25;

    // Disability code
    string disability_code = 26;

    // Advice time in minutes
    int32 advice_time = 27;

    // Travel time in minutes
    int32 travel_time = 28;

    // Waiting time in minutes
    int32 waiting_time = 29;

    // Net counsel costs amount
    double net_counsel_costs_amount = 30;

    // Case ID
    string case_id = 31;

    // Case reference number
    string case_reference_number = 32;

    // Whether VAT is applicable
    bool is_vat_applicable = 33;

    // Submission ID
    string submission_id = 34;

    // Prior authority reference
    string prior_authority_reference = 35;

    // Court location code
    string court_location_code = 36;

    // Advice type code
    string advice_type_code = 37;

    // Surgery date (format: YYYY-MM-DD)
    string surgery_date = 38;

    // AIT hearing centre code
    string ait_hearing_centre_code = 39;

    // Local authority number
    string local_authority_number = 40;

    // User ID who created the claim
    string created_by_user_id = 41;

    // Whether the claim has been amended
    bool is_amended = 42;

    // Whether the claim has an assessment
    bool has_assessment = 43;

    // Version number
    int32 version = 44;

    // Crime matter type code
    string crime_matter_type_code = 45;

    // Fee scheme code
    string fee_scheme_code = 46;

    // Meetings attended code
    string meetings_attended_code = 47;
}

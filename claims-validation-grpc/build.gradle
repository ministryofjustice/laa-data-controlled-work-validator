plugins {
    id 'io.freefair.lombok'
    id 'uk.gov.laa.springboot.laa-spring-boot-gradle-plugin'
    id 'com.google.protobuf' version '0.9.4'
    id 'io.sentry.jvm.gradle'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.3'
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.62.2'
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

// Fix task dependency issues with protobuf plugin and dependent projects
afterEvaluate {
    tasks.named('extractIncludeProto').configure {
        dependsOn ':claims-validation-core:bootBuildInfo'
        dependsOn ':claims-validation-api:bootBuildInfo'
        dependsOn ':reference-fee-scheme-platform-api:bootBuildInfo'
    }
    tasks.named('extractIncludeTestProto').configure {
        dependsOn ':claims-validation-core:bootBuildInfo'
        dependsOn ':claims-validation-api:bootBuildInfo'
        dependsOn ':reference-fee-scheme-platform-api:bootBuildInfo'
    }
}

// Exclude generated proto files from checkstyle
checkstyleMain {
    source = fileTree('src/main/java')
}

checkstyleTest {
    source = fileTree('src/test/java')
}

sourceSets {
    main {
        java {
            srcDirs 'build/generated/source/proto/main/grpc'
            srcDirs 'build/generated/source/proto/main/java'
        }
    }
}

dependencies {
    implementation project(':claims-validation-api')
    implementation project(':claims-validation-core')

    // gRPC dependencies
    implementation 'net.devh:grpc-spring-boot-starter:3.1.0.RELEASE'
    implementation 'io.grpc:grpc-protobuf:1.62.2'
    implementation 'io.grpc:grpc-stub:1.62.2'
    implementation 'io.grpc:grpc-services:1.62.2'  // For reflection and health check
    implementation 'com.google.protobuf:protobuf-java:4.28.2'

    // Required for gRPC generated code - generator uses javax.annotation.Generated (not jakarta)
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'

    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Metrics
    implementation 'io.micrometer:micrometer-core'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.grpc:grpc-testing:1.62.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Development
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
}

test {
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/ClaimsValidationGrpcApplication.class', '**/proto/**'])
        }))
    }
}